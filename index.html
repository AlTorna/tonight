<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons.svg" type="image/svg+xml">
<title>Tonight</title>
<style>
  :root { --bg:#0d0f12; --fg:#e8eaed; --mut:#8b929c; --line:#23272e; --acc:#c9a227; --err:#ef4444; --ok:#22c55e; }
  * { box-sizing:border-box; }
  html, body { margin:0; padding:0; background:var(--bg); }
  body { color:var(--fg); font-family:Inter,system-ui,-apple-system,sans-serif; -webkit-tap-highlight-color:transparent; }
  .app { min-height:100dvh; display:flex; flex-direction:column; max-width:560px; margin:0 auto; padding:0 18px env(safe-area-inset-bottom); }
  header { padding:18px 0 12px; }
  .k { font-size:11px; letter-spacing:.12em; color:var(--mut); }
  .count { font-family:ui-monospace,monospace; font-size:56px; font-weight:500; line-height:1; margin-top:4px; }
  .count small { font-size:20px; color:var(--mut); font-weight:400; }
  .dots { display:flex; gap:8px; margin-top:12px; }
  .dot { width:28px; height:28px; border-radius:50%; border:1px solid var(--line); }
  .dot.on { background:var(--acc); border-color:var(--acc); }
  .ep { font-size:11px; color:var(--mut); margin-top:8px; }
  main { flex:1; }
  label { display:block; font-size:11px; color:var(--mut); margin:12px 0 3px; letter-spacing:.04em; }
  input, select { width:100%; padding:13px; border-radius:8px; border:1px solid var(--line); background:#12151a; color:var(--fg); font-size:16px; font-family:inherit; }
  input:focus, select:focus { outline:none; border-color:var(--acc); }
  .two { display:flex; gap:10px; }
  .two > div { flex:1; }
  details { margin-top:14px; }
  summary { font-size:12px; color:var(--mut); }
  footer { position:sticky; bottom:0; background:var(--bg); padding:12px 0 14px; }
  button.log { width:100%; padding:17px; border-radius:10px; border:1px solid var(--acc); background:var(--bg); color:var(--acc); font-size:16px; font-family:inherit; font-weight:500; }
  button.log:active { background:#1a1e24; }
  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(84px + env(safe-area-inset-bottom)); background:#1a1e24; border:1px solid var(--line); color:var(--fg); font-size:13px; padding:9px 14px; border-radius:20px; opacity:0; transition:opacity .18s; pointer-events:none; }
  .toast.show { opacity:1; }
  .toast.bad { border-color:var(--err); color:var(--err); }
  .note { font-size:11px; color:var(--mut); line-height:1.6; margin-top:14px; }
  .install { display:none; width:100%; margin-top:8px; padding:11px; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--mut); font-family:inherit; font-size:12px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:4px; }
  .chip { display:inline-flex; align-items:center; gap:7px; padding:11px 14px; border:1px solid var(--line); border-radius:20px; font-size:13px; color:var(--fg); margin:0; }
  .chip input { width:auto; margin:0; accent-color:var(--acc); }
  .chip:has(input:checked) { border-color:var(--acc); color:var(--acc); }
</style>
</head>
<script src="./app.js" defer>
</script>
<body>

<div class="app">
  <header>
    <div class="k">TONIGHT · <span id="sd"></span></div>
    <div class="count"><span id="n">0</span><small> / 5</small></div>
    <div class="dots" id="dots"></div>
    <div class="ep" id="ep">checking…</div>
  </header>

  <main>
    <label for="co">Company</label>
    <input id="co" autocomplete="organization">

    <label>Platforms</label>
    <div class="chips" id="pf">
      <label class="chip"><input type="checkbox" value="YouTube"><span>YouTube</span></label>
      <label class="chip"><input type="checkbox" value="Instagram"><span>Instagram</span></label>
      <label class="chip"><input type="checkbox" value="Website"><span>Website</span></label>
      <label class="chip"><input type="checkbox" value="LinkedIn"><span>LinkedIn</span></label>
      <label class="chip"><input type="checkbox" value="X"><span>X</span></label>
      <label class="chip"><input type="checkbox" value="TikTok"><span>TikTok</span></label>
    </div>

    <label for="st">Status</label>
    <select id="st"><option>Sent</option><option>Replied</option><option>No reply</option><option>Call booked</option><option>Dead</option></select>

    <label for="em">Email</label>
    <input id="em" type="email" inputmode="email" autocomplete="email">

    <label for="ph">Phone</label>
    <input id="ph" type="tel" inputmode="tel" autocomplete="tel">

    <div class="two">
      <div><label for="ch">Channel</label>
        <select id="ch"><option>Email</option><option>DM</option><option>LinkedIn</option><option>Call</option><option>Other</option></select>
      </div>
      <div><label for="st">Status</label>
        <select id="st"><option>Sent</option><option>Replied</option><option>No reply</option><option>Call booked</option><option>Dead</option></select>
      </div>
    </div>

    <label for="fu">Next follow-up</label>
    <input id="fu" type="date">

    <details>
      <summary>Website, LinkedIn, location</summary>
      <label for="wb">Website</label><input id="wb" inputmode="url">
      <label for="li">LinkedIn</label><input id="li" inputmode="url">
      <label for="lo">Location</label><input id="lo">
    </details>

    <div class="note">Floor 5, never averaged. Raise to 7 after three clean nights under 04:00. AIC assignment before the shift. Decision gate 5 Dec.</div>
  </main>

  <footer>
    <button class="log" id="go">Log contact</button>
    <button class="install" id="inst">Install to home screen</button>
  </footer>
</div>
<div class="toast" id="toast"></div>
